name: scan_my_mandir
description: "Scan My Mandir - AI-assisted home mandir scanning"
publish_to: 'none'

# versionName+versionCode for Android. The final release versioning scheme is
# confirmed at P12-01.
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# Versions are pinned exactly rather than with carets. A minor bump in a state
# management or routing package can change behaviour subtly, and this project needs
# reproducible builds across machines and CI. Upgrade deliberately.
dependencies:
  cupertino_icons: 1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management (docs/decisions.md D-12). One approach throughout: controllers
  # expose immutable state, widgets read it.
  flutter_riverpod: 3.4.3
  # Declarative routing, so the scan flow's states map onto routes predictably.
  go_router: 17.5.0
  # Pinned to what flutter_localizations requires in this Flutter version.
  intl: 0.20.2

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Generates the localization classes from lib/l10n/*.arb using l10n.yaml.
  generate: true
