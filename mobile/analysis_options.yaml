include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A missing await is almost always a bug in async scan/upload flows, so it fails
    # analysis rather than producing a warning nobody reads.
    unawaited_futures: error
    # Keeps generated localization out of analysis noise while still compiling.
    todo: ignore
  exclude:
    - lib/l10n/generated/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
